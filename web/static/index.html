<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLPI - Painel TV</title>
  <style>
    /* Reset & Variáveis - Otimizado para TV, Cantos Retos (0px), Sem Degrades */
    :root {
      --bg-body: #0a0d12;
      --bg-surface: #12171f;
      --bg-header: #070a0e;
      --border-color: #27303d;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --accent: #238636;
      --accent-hover: #2ea043;
      --new-badge: #1f6feb;
      --atrib-badge: #d29922;
      --pend-badge: #bc8cff;
      --table-stripe: #0e1218;
      --table-hover: #19202b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0 !important;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 15px;
      line-height: 1.35;
      padding: 0;
      margin: 0;
      overflow-x: hidden;
    }

    /* Header Compacto para TV */
    header {
      background-color: var(--bg-header);
      border-bottom: 2px solid var(--border-color);
      padding: 10px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand h1 {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .brand span.tag {
      background-color: #1a222d;
      border: 1px solid var(--border-color);
      color: #79c0ff;
      font-size: 12px;
      padding: 3px 8px;
      font-weight: 700;
    }

    .header-info {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    button {
      background-color: #1a222d;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    button.active-sound {
      background-color: #1f6feb;
      border-color: #388bfd;
      color: #ffffff;
    }

    .container {
      padding: 16px 24px;
      width: 100%;
    }

    /* Banner Gigante de Alerta para TV */
    #alertBanner {
      display: none;
      background-color: #0c2d6b;
      border: 2px solid #388bfd;
      color: #ffffff;
      padding: 14px 20px;
      margin-bottom: 16px;
      font-size: 16px;
      font-weight: 700;
      align-items: center;
      justify-content: space-between;
      animation: alertPulse 1.2s infinite alternate;
    }

    @keyframes alertPulse {
      from { background-color: #0c2d6b; border-color: #388bfd; }
      to { background-color: #1f6feb; border-color: #ffffff; }
    }

    /* Cards de Métricas com números grandes para TV */
    .metrics-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .metric-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      padding: 12px 18px;
    }

    .metric-title {
      font-size: 12px;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .metric-value {
      font-size: 32px;
      font-weight: 800;
      line-height: 1;
      color: #ffffff;
    }

    .metric-card.total { border-left: 5px solid var(--text-muted); }
    .metric-card.novo { border-left: 5px solid var(--new-badge); }
    .metric-card.atendimento { border-left: 5px solid var(--atrib-badge); }
    .metric-card.pendente { border-left: 5px solid var(--pend-badge); }

    /* Tabela Otimizada para Painel TV */
    .table-container {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      width: 100%;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background-color: var(--bg-header);
      color: var(--text-muted);
      font-size: 12px;
      text-transform: uppercase;
      font-weight: 800;
      padding: 12px 14px;
      border-bottom: 2px solid var(--border-color);
      white-space: nowrap;
    }

    td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-color);
      font-size: 15px;
      font-weight: 500;
    }

    tr:nth-child(even) {
      background-color: var(--table-stripe);
    }

    tr:hover {
      background-color: var(--table-hover);
    }

    tr.highlight-new {
      background-color: rgba(31, 111, 235, 0.28) !important;
      border-left: 5px solid #58a6ff;
    }

    /* Badges de Status Limpos */
    .badge {
      display: inline-block;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-novo { background-color: #1f6feb; color: #ffffff; }
    .badge-atribuido { background-color: #9e6a03; color: #ffffff; }
    .badge-planejado { background-color: #1b7c83; color: #ffffff; }
    .badge-pendente { background-color: #6e40c9; color: #ffffff; }
    .badge-solucionado { background-color: #238636; color: #ffffff; }
    .badge-outro { background-color: #262c36; color: var(--text-muted); }

    .prio-alta { color: #f85149; font-weight: 800; }
    .prio-media { color: #d29922; font-weight: 700; }
    .prio-baixa { color: #8b949e; }

    a.ticket-link {
      color: #f0f6fc;
      text-decoration: none;
      font-weight: 600;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 18px;
    }

    .status-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      background-color: var(--accent);
      margin-right: 6px;
    }

    .status-dot.syncing {
      background-color: var(--atrib-badge);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div id="liveDot" class="status-dot"></div>
      <h1>Painel de Chamados</h1>
      <span class="tag">Fila Sistemas</span>
      <span id="lastSync" style="color: var(--text-muted); font-size: 12px; margin-left: 10px;">Atualizando...</span>
    </div>

    <div class="header-info">
      <button id="soundToggle" class="active-sound" onclick="toggleSound()">
        🔊 Som Ativo
      </button>
      <button onclick="playAirportChime(true)">
        🔔 Testar Som (Aeroporto)
      </button>
      <button onclick="loadTickets()">
        🔄 Atualizar
      </button>
    </div>
  </header>

  <div class="container">
    
    <!-- Banner de Alerta para TV -->
    <div id="alertBanner">
      <div id="alertMessage">🚨 NOVO CHAMADO RECEBIDO NA FILA!</div>
      <button onclick="dismissAlert()" style="background: transparent; border: 1px solid #ffffff; color: #ffffff; padding: 4px 10px;">✕</button>
    </div>

    <!-- Métricas TV -->
    <div class="metrics-bar">
      <div class="metric-card total">
        <div class="metric-title">Total em Aberto</div>
        <div class="metric-value" id="countTotal">0</div>
      </div>
      <div class="metric-card novo">
        <div class="metric-title">Novos</div>
        <div class="metric-value" id="countNovo" style="color: #58a6ff;">0</div>
      </div>
      <div class="metric-card atendimento">
        <div class="metric-title">Atribuídos</div>
        <div class="metric-value" id="countAtribuido" style="color: #e3b341;">0</div>
      </div>
      <div class="metric-card pendente">
        <div class="metric-title">Pendentes</div>
        <div class="metric-value" id="countPendente" style="color: #d2a8ff;">0</div>
      </div>
    </div>

    <!-- Tabela Direta e Limpa sem filtros manuais -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th style="width: 80px;">ID</th>
            <th>Título do Chamado</th>
            <th style="width: 220px;">Categoria</th>
            <th style="width: 140px;">Status</th>
            <th style="width: 110px;">Prioridade</th>
            <th style="width: 250px;">Departamento</th>
            <th style="width: 170px;">Última Modificação</th>
          </tr>
        </thead>
        <tbody id="ticketsBody">
          <tr>
            <td colspan="7" class="empty-state">Carregando chamados do GLPI...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <script>
    let ticketsData = [];
    let knownTicketIDs = new Set();
    let isInitialLoad = true;
    let soundEnabled = true;
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // Sinal sonoro de chamada de aeroporto estilo chime clássico de 4 notas longas e ressonantes
    // Sequência aeroporto internacional: C5 (523Hz) -> G4 (392Hz) -> F4 (349Hz) -> C4 (261Hz)
    // Prolongado e marcante com harmônicos tubulares para ambiente de TV
    function playAirportChime(force) {
      if (!soundEnabled && !force) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;

        const now = ctx.currentTime;

        function playHarmonicTone(freq, startTime, duration, volume) {
          // Fundamental
          const osc1 = ctx.createOscillator();
          const gain1 = ctx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(freq, startTime);

          // Segundo harmônico sutil (típico de carrilhão/chime de aeroporto)
          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(freq * 2, startTime);

          // Envelope suave e longo
          gain1.gain.setValueAtTime(0.0001, startTime);
          gain1.gain.linearRampToValueAtTime(volume, startTime + 0.05);
          gain1.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

          gain2.gain.setValueAtTime(0.0001, startTime);
          gain2.gain.linearRampToValueAtTime(volume * 0.25, startTime + 0.04);
          gain2.gain.exponentialRampToValueAtTime(0.0001, startTime + (duration * 0.7));

          osc1.connect(gain1);
          osc2.connect(gain2);
          gain1.connect(ctx.destination);
          gain2.connect(ctx.destination);

          osc1.start(startTime);
          osc1.stop(startTime + duration);
          osc2.start(startTime);
          osc2.stop(startTime + duration);
        }

        // Chime de Aeroporto Completo e Longo:
        // Nota 1: G4 (392.00 Hz) - 1.2s de duração
        playHarmonicTone(392.00, now, 1.2, 0.40);

        // Nota 2: E4 (329.63 Hz) - toca aos 0.40s
        playHarmonicTone(329.63, now + 0.40, 1.3, 0.40);

        // Nota 3: C4 (261.63 Hz) - toca aos 0.85s
        playHarmonicTone(261.63, now + 0.85, 1.4, 0.42);

        // Nota 4: G3 (196.00 Hz) - resolução longa e marcante com 2.2s de cauda ressonante
        playHarmonicTone(196.00, now + 1.30, 2.2, 0.45);

      } catch (err) {
        console.error("Erro ao reproduzir alerta de áudio:", err);
      }
    }

    function toggleSound() {
      getAudioContext();
      soundEnabled = !soundEnabled;
      const btn = document.getElementById('soundToggle');
      if (soundEnabled) {
        btn.classList.add('active-sound');
        btn.innerText = '🔊 Som Ativo';
        playAirportChime(true);
      } else {
        btn.classList.remove('active-sound');
        btn.innerText = '🔇 Som Mudo';
      }
    }

    function showAlert(msg) {
      const banner = document.getElementById('alertBanner');
      document.getElementById('alertMessage').innerText = msg;
      banner.style.display = 'flex';
    }

    function dismissAlert() {
      document.getElementById('alertBanner').style.display = 'none';
    }

    function updateMetrics(tickets) {
      let total = tickets.length;
      let novo = 0;
      let atribuido = 0;
      let pendente = 0;

      tickets.forEach(t => {
        if (t.status_id === 1) novo++;
        else if (t.status_id === 2 || t.status_id === 3) atribuido++;
        else if (t.status_id === 4) pendente++;
      });

      document.getElementById('countTotal').innerText = total;
      document.getElementById('countNovo').innerText = novo;
      document.getElementById('countAtribuido').innerText = atribuido;
      document.getElementById('countPendente').innerText = pendente;
    }

    function renderTable() {
      const tbody = document.getElementById('ticketsBody');

      if (!ticketsData || ticketsData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty-state">Nenhum chamado em aberto no momento.</td></tr>`;
        return;
      }

      tbody.innerHTML = ticketsData.map(t => {
        let statusBadgeClass = 'badge-outro';
        if (t.status_id === 1) statusBadgeClass = 'badge-novo';
        else if (t.status_id === 2) statusBadgeClass = 'badge-atribuido';
        else if (t.status_id === 3) statusBadgeClass = 'badge-planejado';
        else if (t.status_id === 4) statusBadgeClass = 'badge-pendente';
        else if (t.status_id === 5) statusBadgeClass = 'badge-solucionado';

        let prioClass = 'prio-baixa';
        if (t.priority_id >= 4) prioClass = 'prio-alta';
        else if (t.priority_id === 3) prioClass = 'prio-media';

        const isNewHighlight = t.status_id === 1 ? 'highlight-new' : '';

        return `
          <tr class="${isNewHighlight}">
            <td style="font-weight: 800; color: #ffffff;">#${t.id}</td>
            <td>
              <a href="${t.url}" target="_blank" class="ticket-link">
                ${escapeHtml(t.title)}
              </a>
            </td>
            <td>${escapeHtml(t.category || '-')}</td>
            <td><span class="badge ${statusBadgeClass}">${escapeHtml(t.status)}</span></td>
            <td><span class="${prioClass}">${escapeHtml(t.priority)}</span></td>
            <td>${escapeHtml(t.requester_group || '-')}</td>
            <td style="color: var(--text-muted); font-size: 13px;">${escapeHtml(t.date_mod)}</td>
          </tr>
        `;
      }).join('');
    }

    function escapeHtml(text) {
      if (!text) return '';
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    async function loadTickets() {
      const dot = document.getElementById('liveDot');
      dot.classList.add('syncing');

      try {
        const resp = await fetch('/api/tickets?limit=150', { cache: 'no-store' });
        if (!resp.ok) throw new Error('Falha HTTP: ' + resp.status);

        const res = await resp.json();
        const incomingTickets = res.data || [];

        // Detectar novos chamados
        let newlyArrived = [];
        if (!isInitialLoad) {
          incomingTickets.forEach(t => {
            if (!knownTicketIDs.has(t.id)) {
              newlyArrived.push(t);
            }
          });

          if (newlyArrived.length > 0) {
            playAirportChime(false);
            const first = newlyArrived[0];
            showAlert(`🚨 NOVO CHAMADO: #${first.id} - ${first.title}`);
          }
        }

        ticketsData = incomingTickets;
        knownTicketIDs = new Set(incomingTickets.map(t => t.id));
        isInitialLoad = false;

        updateMetrics(ticketsData);
        renderTable();

        document.getElementById('lastSync').innerText = 'Última sinc: ' + (res.time || new Date().toLocaleTimeString());

      } catch (err) {
        console.error('Erro na sincronização:', err);
        document.getElementById('lastSync').innerText = 'Erro na sincronização';
      } finally {
        dot.classList.remove('syncing');
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      document.body.addEventListener('click', () => {
        getAudioContext();
      }, { once: true });

      loadTickets();
      // Polling a cada 15 segundos para TV
      setInterval(loadTickets, 15000);
    });
  </script>
</body>
</html>
